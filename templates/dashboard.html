<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Dashboard</title>
    <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
    <div class="container">
        <h1>📦 Stylish Dashboard</h1>
        
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('categories', this)">Categories</button>
            <button class="tab-btn" onclick="switchTab('products', this)">Products</button>
            <button class="tab-btn" onclick="switchTab('collections', this)">Collections</button>
        </div>

        <!-- CATEGORIES TAB -->
        <div id="categories" class="tab-content active">
            <div class="section">
                <h2>Add/Edit Category</h2>
                <div id="categoryMessage"></div>
                <form onsubmit="handleCategoryForm(event)">
                    <div class="form-group">
                        <label>Category ID (leave empty for new):</label>
                        <input type="number" id="categoryId" placeholder="Auto-filled when editing">
                    </div>
                    <div class="form-group">
                        <label>Category Code:</label>
                        <input type="text" id="categoryCode" required>
                    </div>
                    <div class="form-group">
                        <label>Category Name:</label>
                        <input type="text" id="categoryName" required>
                    </div>

                    <button type="submit" id="categorySaveBtn" class="success">Add Category</button>
                    <button type="button" class="danger" onclick="resetCategoryForm()" style="margin-left: 10px;">Reset</button>
                </form>
            </div>

            <div class="section">
                <h2>Categories List</h2>
                <table id="categoriesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- PRODUCTS TAB -->
        <div id="products" class="tab-content">
            <div class="section">
                <h2>Add/Edit Product</h2>
                <div id="productMessage"></div>
                <form onsubmit="handleProductForm(event)">
                    <div class="form-group">
                        <label>Product ID (leave empty for new):</label>
                        <input type="number" id="productId" placeholder="Auto-filled when editing">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Product Name:</label>
                            <input type="text" id="productName" required>
                        </div>
                        <div class="form-group">
                            <label>SKU:</label>
                            <input type="text" id="productSku" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Price:</label>
                            <input type="number" id="productPrice" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label>Currency:</label>
                            <input type="text" id="productCurrency" value="USD" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category:</label>
                            <select id="productCategory" required></select>
                        </div>
                        <div class="form-group">
                            <label>In Stock:</label>
                            <select id="productInStock">
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Rating:</label>
                            <input type="number" id="productRating" step="0.1" min="0" max="5" value="0">
                        </div>
                        <div class="form-group">
                            <label>Reviews:</label>
                            <input type="number" id="productReviews" min="0" value="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Image Path:</label>
                        <input type="text" id="productImagePath" placeholder="e.g., /images/product.jpg">
                    </div>
                    <button type="submit" id="productSaveBtn" class="success">Add Product</button>
                    <button type="button" class="danger" onclick="resetProductForm()" style="margin-left: 10px;">Reset</button>
                </form>
            </div>

            <div class="section">
                <h2>Products List</h2>
                <table id="productsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Price</th>
                            <th>Category</th>
                            <th>In Stock</th>
                            <th>Rating</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- COLLECTIONS TAB -->
        <div id="collections" class="tab-content">
            <div class="section">
                <h2>Add/Edit Collection</h2>
                <div id="collectionMessage"></div>
                <form onsubmit="handleCollectionForm(event)">
                    <div class="form-group">
                        <label>Collection ID (leave empty for new):</label>
                        <input type="number" id="collectionId" placeholder="Auto-filled when editing">
                    </div>
                    <div class="form-group">
                        <label>Collection Code:</label>
                        <input type="text" id="collectionCode" required>
                    </div>
                    <div class="form-group">
                        <label>Collection Name:</label>
                        <input type="text" id="collectionName" required>
                    </div>

                    <button type="submit" id="collectionSaveBtn" class="success">Add Collection</button>
                    <button type="button" class="danger" onclick="resetCollectionForm()" style="margin-left: 10px;">Reset</button>
                </form>
            </div>

            <div class="section">
                <h2>Collections List</h2>
                <table id="collectionsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Code</th>
                            <th>Name</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="section" id="collectionProductsSection" style="display: none;">
                <h2>Manage Products in Collection: <span id="selectedCollectionName"></span></h2>
                <div class="form-row">
                    <div class="form-group">
                        <label>Add Product:</label>
                        <select id="addProductSelect"></select>
                    </div>
                    <button onclick="addProductToCollection()" class="success">Add Product</button>
                </div>
                <table id="collectionProductsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="/static/dashboard.js"></script>
</body>
</html>
